[package]
name = "wasm-runner-js"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
elliptic-curve = "0.14.0-rc.29"
# Use the workspace dkls23-core by path
dkls23-core = { path = "../../../dkls23-core", features = ["serde"] }
k256 = { version = "0.14.0-rc.8" }

[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
version = "0.2"
features = ["js"]
